<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天外召喚錄 — 卡片英雄 RPG v0.2</title>
<style>
:root{
  --bg:#141a26; --panel:#1d2534; --panel2:#25304a; --line:#33405c;
  --txt:#e8ecf4; --dim:#8fa0bd; --gold:#f0c75e; --green:#5ec97f; --red:#e06a5a; --blue:#5fa8e8; --purple:#a97fe8;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:"PingFang TC","Microsoft JhengHei",sans-serif}
body{background:radial-gradient(1200px 600px at 50% -100px,#1e2a44,var(--bg));color:var(--txt);min-height:100vh}
#app{max-width:980px;margin:0 auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#1d2534,#2a3552);border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-bottom:10px;flex-wrap:wrap;gap:6px}
header h1{font-size:20px;color:var(--gold);text-shadow:0 0 12px rgba(240,199,94,.4)}
.res{display:flex;gap:14px;font-size:14px;flex-wrap:wrap}
.res b{color:var(--gold)}
nav{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
nav button{flex:1;min-width:82px;padding:9px 4px;background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--dim);cursor:pointer;font-size:13px;transition:.15s}
nav button:hover{color:var(--txt);border-color:var(--blue)}
nav button.on{background:var(--panel2);color:var(--gold);border-color:var(--gold)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.panel h2{font-size:16px;color:var(--blue);margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
/* ---- 卡片美術 ---- */
.card{background:linear-gradient(160deg,var(--panel2),#1a2338);border:1px solid var(--line);border-radius:12px;padding:10px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;inset:0;background:radial-gradient(120px 60px at 50% 0%,rgba(255,255,255,.06),transparent);pointer-events:none}
.card.r-N{border-color:#3a4a68}
.card.r-R{border-color:#3d6ea8;box-shadow:inset 0 0 24px rgba(95,168,232,.12)}
.card.r-SR{border-color:#8a5fd0;box-shadow:inset 0 0 26px rgba(169,127,232,.16)}
.card.r-SSR{border-color:#c9a13f;box-shadow:inset 0 0 30px rgba(240,199,94,.22),0 0 10px rgba(240,199,94,.15)}
.card.r-SSR::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.14),transparent);animation:shine 3.5s infinite}
@keyframes shine{0%{left:-60%}55%{left:130%}100%{left:130%}}
.card.sel{outline:2px solid var(--gold)}
.card .emoji{font-size:40px;text-align:center;display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
.card .name{font-weight:bold;text-align:center;font-size:15px}
.r-N{color:var(--dim)} .r-R{color:var(--blue)} .r-SR{color:var(--purple)} .r-SSR{color:var(--gold)}
.badge{position:absolute;top:6px;right:6px;font-size:11px;padding:1px 6px;border-radius:8px;background:#0e1420;border:1px solid var(--line);z-index:1}
.stats{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.5}
.bar{height:7px;background:#0e1420;border-radius:4px;overflow:hidden;margin:3px 0}
.bar i{display:block;height:100%;border-radius:4px;transition:width .4s}
button.act{background:#2e4a72;border:1px solid #45679c;color:#dceaff;border-radius:7px;padding:6px 12px;cursor:pointer;font-size:13px;margin-top:6px;transition:.12s}
button.act:hover:not(:disabled){filter:brightness(1.25);transform:translateY(-1px)}
button.act:disabled{opacity:.35;cursor:not-allowed}
button.gold{background:#6b5320;border-color:#a9853a;color:#ffe9b0}
button.red{background:#5a2c26;border-color:#8c453c;color:#ffd9d3}
button.green{background:#2b5638;border-color:#4a8f60;color:#d3ffe0}
.slots{display:flex;gap:6px;justify-content:center;margin-top:8px}
.slot{width:42px;height:42px;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;background:#0e1420;transition:.15s}
.slot.full{border-style:solid;border-color:var(--green)}
.slot:hover{border-color:var(--gold)}
.hint{font-size:12px;color:var(--dim);line-height:1.6}
#battlelog{height:170px;overflow-y:auto;background:#0e1420;border-radius:8px;padding:8px;font-size:13px;line-height:1.6;margin-top:8px}
.hpnum{font-size:11px;color:var(--dim)}
.light{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.green{background:var(--green)} .redl{background:var(--red)}
select{background:#0e1420;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:5px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0e1420;border:1px solid var(--gold);color:var(--gold);padding:10px 22px;border-radius:10px;z-index:99;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.5);animation:pop .25s}
@keyframes pop{from{transform:translate(-50%,14px);opacity:0}}
.mats{display:flex;gap:8px;flex-wrap:wrap;font-size:13px}
.mats span{background:#0e1420;border:1px solid var(--line);border-radius:8px;padding:4px 9px}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:50;animation:pop .2s}
.modal{background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:18px;max-width:460px;width:92%;max-height:88vh;overflow-y:auto}
.vs{display:flex;justify-content:space-between;align-items:center;gap:10px}
.vs .side{flex:1;text-align:center;position:relative}
.vs .side .big{font-size:44px;display:inline-block;transition:.1s}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.flash{animation:flash .35s}
@keyframes flash{50%{filter:brightness(3)}}
.dmgfloat{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-weight:bold;font-size:18px;animation:rise .9s forwards;pointer-events:none;text-shadow:0 2px 4px #000}
@keyframes rise{to{transform:translate(-50%,-34px);opacity:0}}
.summonfx{position:fixed;inset:0;background:radial-gradient(circle at 50% 55%,rgba(240,199,94,.35),transparent 60%);z-index:60;pointer-events:none;animation:fadeout .8s forwards}
@keyframes fadeout{to{opacity:0}}
h3.sub{font-size:13px;color:var(--dim);margin:10px 0 4px}
.small{font-size:12px}
.price{color:var(--gold);font-size:12px}
.tag{font-size:11px;background:#0e1420;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--dim)}
</style>
</head>

/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
const heroDef=h=>{ const d=HERO_DEFS.find(x=>x.id===h.defId); return d||{name:h.name||'傭兵',emoji:h.emoji||'🗡️',type:h.type||'武者',rarity:'R',ranged:!!h.ranged,lore:''}; };
function toast(msg,color){
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  if(color){el.style.borderColor=color;el.style.color=color;}
  $('#toasts').appendChild(el); setTimeout(()=>el.remove(),2600);
}
function heroStats(h){
  const d=heroDef(h); const g=TYPE_GROWTH[d.type]||TYPE_GROWTH.武者;
  const st={}; for(const k of ['str','vit','agi','wis','luk']) st[k]=(d.base?d.base[k]:8)+g[k]*(h.lvl-1)+(h.perm[k]||0);
  for(const slot of h.slots){ if(!slot)continue; const c=CARD_DEFS[slot]; if(c&&c.bonus)for(const k in c.bonus)st[k]+=c.bonus[k]; }
  return st;
}
function heroPower(h){const s=heroStats(h);return Math.round(s.str*3+s.vit*3+s.agi*2+s.wis*2+s.luk*1);}
function heroHp(h){const s=heroStats(h);return Math.round(30+s.vit*8+h.lvl*4);}
function heroAtk(h){const s=heroStats(h);const d=heroDef(h);return Math.round((d.ranged? s.agi*1.6+s.wis*.6 : s.str*1.8)+h.lvl*2+3);}
function heroDef_(h){const s=heroStats(h);return Math.round(s.vit*.8+s.agi*.4);}
function heroCrit(h){const s=heroStats(h);return Math.min(.35, s.luk/200+s.agi/400);}
function expNeed(l){return l*l*30+50;}
function slotsOf(h){return {N:3,R:3,SR:4,SSR:5}[heroDef(h).rarity]||3;}
function makeHero(defId,lvl=1){
  const d=HERO_DEFS.find(x=>x.id===defId);
  return {uid:defId+'_'+Math.random().toString(36).slice(2,7), defId, lvl, exp:0, fatigue:0,
          perm:{str:0,vit:0,agi:0,wis:0,luk:0}, slots:[null,null,null,null,null], job:null, jobStart:0};
}
function weightedPick(weights){
  let t=0;for(const k in weights)t+=weights[k];let r=Math.random()*t;
  for(const k in weights){r-=weights[k];if(r<=0)return k;}return Object.keys(weights)[0];
}
function today(){return Math.floor(Date.now()/86400000);}
function summonFx(){const el=document.createElement('div');el.className='summonfx';document.body.appendChild(el);setTimeout(()=>el.remove(),800);}
function floatDmg(sideId,txt,color){
  const side=document.getElementById(sideId); if(!side)return;
  const f=document.createElement('div');f.className='dmgfloat';f.style.color=color;f.textContent=txt;
  side.appendChild(f);setTimeout(()=>f.remove(),900);
  const big=side.querySelector('.big'); if(big){big.classList.add('shake');setTimeout(()=>big.classList.remove('shake'),350);}
}

/* ================= 離線結算 ================= */
function offlineProgress(){
  const now=Date.now();
  const elapsed=Math.min((now-(S.lastTick||now))/1000, 8*3600);
  if(elapsed<1) return;
  const notes=[];
  for(const h of S.heroes){
    if(h.job){
      const j=JOBS.find(x=>x.id===h.job); const st=heroStats(h);
      const eff=(st[JOB_BASE[j.id]]||8)/16 * j.rate;
      const gain=Math.floor(elapsed/20*eff*(1+h.lvl*.08));
      if(gain>0){ S.inv.mats[j.mat]=(S.inv.mats[j.mat]||0)+gain;
        notes.push(`${heroDef(h).name} 打工帶回 ${j.matName}×${gain}`); }
      h.fatigue=Math.min(100,h.fatigue+elapsed*0.002);
    } else if(S.summoned!==h.uid && S.stallHero!==h.uid){
      h.fatigue=Math.max(0,h.fatigue-elapsed*0.015);
    }
  }
  // 離線攤販：每 90 秒一位顧客（運氣加成），按存貨結算
  if(S.stallHero && S.stallStock.length){
    const h=S.heroes.find(x=>x.uid===S.stallHero);
    if(h){
      const st=heroStats(h);
      let customers=Math.floor(elapsed/90*(0.8+st.luk/30));
      let revenue=0, sold=[];
      while(customers-->0 && S.stallStock.length){
        const it=S.stallStock[Math.floor(Math.random()*S.stallStock.length)];
        revenue+=it.price; sold.push(`${MATERIALS[it.mat]?MATERIALS[it.mat].e:''}${it.price}🪙`);
        it.count--; if(it.count<=0) S.stallStock=S.stallStock.filter(x=>x!==it);
      }
      if(revenue>0){ S.gold+=revenue; notes.push(`你的攤位離線期間進帳 🪙${revenue}`); }
    }
  }
  if(notes.length) setTimeout(()=>toast('⏰ '+notes[0]+' 等離線收益'),400);
}

/* ---- 點將錄 ---- */
function busy(h){ return !!h.job || S.stallHero===h.uid; }
function renderRoster(){
  if(S.heroes.length===0) return `<div class="panel"><p class="hint">點將錄空空如也…去「客棧抽卡」吧！</p></div>`;
  const sorted=[...S.heroes].sort((a,b)=>heroPower(b)-heroPower(a));
  return `<div class="panel"><h2>📖 點將錄（${S.heroes.length} 張英雄卡）</h2>
  <p class="hint">同時只能召喚 <b>1 位</b>，且不能高於主君 Lv.${S.lv}。疲勞紅燈需休養。插槽數：N/R 3、SR 4、SSR 5。</p>
  <div class="grid">${sorted.map(h=>{
    const d=heroDef(h), st=heroStats(h), red=h.fatigue>=80, summoned=S.summoned===h.uid;
    const slots=[];
    for(let i=0;i<slotsOf(h);i++){ const c=h.slots[i];
      slots.push(`<div class="slot ${c?'full':''}" title="${c?CARD_DEFS[c].name+'（點擊卸下）':'空插槽（背包點裝備）'}" onclick="unequip('${h.uid}',${i})">${c?CARD_DEFS[c].emoji:'＋'}</div>`); }
    const canSummon=!red&&!busy(h)&&h.lvl<=S.lv&&!S.battle;
    return `<div class="card r-${d.rarity} ${summoned?'sel':''}">
      <span class="badge r-${d.rarity}">${d.rarity}</span>
      <span class="emoji">${d.emoji}</span>
      <div class="name">${d.name} <span class="small">Lv.${h.lvl}</span></div>
      <div class="small" style="text-align:center;color:var(--dim)">${d.type}${d.ranged?'・遠程':''}　⚡${heroPower(h)}</div>
      <div class="stats">力${st.str} 體${st.vit} 敏${st.agi} 智${st.wis} 運${st.luk}<br>HP ${heroHp(h)}｜攻 ${heroAtk(h)}｜防 ${heroDef_(h)}</div>
      <div class="bar" title="經驗"><i style="width:${Math.min(100,h.exp/expNeed(h.lvl)*100)}%;background:var(--blue)"></i></div>
      <div class="bar"><i style="width:${h.fatigue}%;background:${red?'var(--red)':'var(--green)'}"></i></div>
      <div class="small" style="text-align:center"><span class="light ${red?'redl':'green'}"></span>${red?'疲勞紅燈':(h.job?'打工中':(S.stallHero===h.uid?'看攤中':'狀態正常'))}
        ${Object.values(h.perm).some(v=>v<0)?'<span style="color:var(--red)">（戰死損傷↓）</span>':''}</div>
      <div class="slots">${slots.join('')}</div>
      <div style="text-align:center">${summoned?`<button class="act red" onclick="unsummon()">收回點將錄</button>`
        :`<button class="act gold" ${canSummon?'':'disabled'} onclick="summon('${h.uid}')">召喚</button>`}</div>
    </div>`;}).join('')}</div></div>`;
}
function summon(uid){
  const h=S.heroes.find(x=>x.uid===uid); if(!h)return;
  S.summoned=uid; summonFx(); toast(`${heroDef(h).emoji} ${heroDef(h).name} 現出實體！`); save(); render();
}
function unsummon(){ S.summoned=null; save(); render(); toast('英雄化卡歸隊，開始恢復疲勞。'); }
function unequip(uid,i){
  const h=S.heroes.find(x=>x.uid===uid); if(!h||!h.slots[i])return;
  const c=h.slots[i]; h.slots[i]=null; S.inv.cards[c]=(S.inv.cards[c]||0)+1;
  toast(`卸下 ${CARD_DEFS[c].name}`); save(); render();
}

/* ---- 戰鬥 ---- */
let battleMon=null;
function renderBattle(){
  if(S.battle) return renderBattleActive();
  const sm=S.summoned&&S.heroes.find(h=>h.uid===S.summoned);
  const modes=Object.entries(AI_MODES).map(([k,m])=>{
    const dis=m.needRanged&&!(sm&&heroDef(sm).ranged);
    return `<button class="act" style="${S.aiMode===k?'border-color:var(--gold);background:#4a4420':''}" onclick="setAI('${k}')">${m.name}<br><span class="small">${m.desc}</span></button>`;
  }).join('');
  return `
  <div class="panel"><h2>🧠 英雄戰術（天外八式 AI）</h2>
    <div class="row">${modes}</div>
    <div class="row" style="margin-top:10px">
      <span class="small" id="aggrlabel">積極度 ${S.aggression}/10（技能觸發機率 × 積極度/10）</span>
      <input type="range" min="1" max="10" value="${S.aggression}" oninput="S.aggression=+this.value;document.getElementById('aggrlabel').textContent='積極度 '+S.aggression+'/10（技能觸發機率 × 積極度/10）'" onchange="save()">
    </div>
    ${sm?'':`<p class="hint" style="margin-top:8px;color:var(--red)">⚠️ 未召喚英雄。先至「點將錄」召喚，或至「傭兵」租借。</p>`}
  </div>
  <div class="panel"><h2>⚔️ 選擇歷練對象</h2><div class="grid">
  ${MONSTERS.map(mon=>{
    const canFight=sm&&!busy(sm)&&mon.lv<=(sm.lvl+3);
    const hint=mon.lv>(sm?sm.lvl+3:3)?'（太強）':'';
    return `<div class="card"><span class="badge">Lv.${mon.lv}</span><span class="emoji">${mon.emoji}</span>
    <div class="name">${mon.name}${hint}</div>
    <div class="stats">HP ${mon.hp}｜攻 ${mon.atk}｜防 ${mon.def}<br>掉落：${Object.entries(mon.drops).map(([m,n])=>MATERIALS[m].e+'×'+n).join(' ')}<br>🪙${mon.gold}｜EXP ${mon.exp}</div>
    <div style="text-align:center"><button class="act red" ${canFight?'':'disabled'} onclick="startBattle('${mon.id}')">出戰</button></div>
    </div>`;}).join('')}
  </div></div>`;
}
function renderBattleActive(){
  const b=S.battle, h=S.heroes.find(x=>x.uid===b.heroUid), d=heroDef(h), mon=MONSTERS.find(m=>m.id===b.monId);
  return `<div class="panel"><h2>⚔️ ${d.name} vs ${mon.name}（${AI_MODES[S.aiMode].name}・積極度${S.aggression}）</h2>
  <div class="vs">
    <div class="side" id="sideHero"><span class="big">${d.emoji}</span><div>${d.name} Lv.${h.lvl}</div>
      <div class="bar"><i style="width:${Math.max(0,b.hp)/b.hpMax*100}%;background:var(--green)"></i></div><div class="hpnum">${Math.max(0,Math.round(b.hp))}/${b.hpMax}</div></div>
    <div style="font-size:22px;color:var(--gold)">⚡</div>
    <div class="side" id="sideMon"><span class="big">${mon.emoji}</span><div>${mon.name}</div>
      <div class="bar"><i style="width:${Math.max(0,b.monHp)/b.monMax*100}%;background:var(--red)"></i></div><div class="hpnum">${Math.max(0,Math.round(b.monHp))}/${b.monMax}</div></div>
  </div>
  <div id="battlelog">${b.log.map(l=>`<div>${l}</div>`).join('')}</div>
  <div class="row" style="margin-top:8px">
    ${b.over?`<button class="act gold" onclick="endBattle()">結束戰鬥</button>`:`<button class="act red" onclick="flee()">逃離戰場</button>`}
  </div></div>`;
}
function setAI(k){ S.aiMode=k; render(); }
function myHeroForBattle(){
  if(!S.summoned) return null;
  return S.heroes.find(h=>h.uid===S.summoned && !busy(h))||null;
}
function startBattle(mid){
  const h=myHeroForBattle(); if(!h) return;
  const mon=MONSTERS.find(m=>m.id===mid);
  if(mon.lv>h.lvl+3){ toast('等級差距過大，英雄不敢應戰','var(--red)');return; }
  S.battle={heroUid:h.uid, monId:mid, hp:heroHp(h), hpMax:heroHp(h), monHp:mon.hp, monMax:mon.hp,
            log:[`【${heroDef(h).name}】（${AI_MODES[S.aiMode].name}）向 ${mon.name} 發起挑戰！`], over:false, monDebuff:1, tauntRounds:0};
  render(); S.battle.timer=setInterval(battleTick,750); battleTick();
}
function battleTick(){
  const b=S.battle; if(!b||b.over)return;
  const h=S.heroes.find(x=>x.uid===b.heroUid), d=heroDef(h), mon=MONSTERS.find(m=>m.id===b.monId);
  const ai=AI_MODES[S.aiMode];
  // 英雄行動
  let atk=heroAtk(h)*ai.dmgM*(0.85+Math.random()*0.3);
  let crit=Math.random()<heroCrit(h); if(crit)atk*=1.5;
  let skillTxt='';
  for(const slot of h.slots){
    if(!slot)continue; const c=CARD_DEFS[slot]; if(c.kind!=='skill')continue;
    const p=(c.rate||0)*S.aggression/10;
    if(Math.random()<p){
      if(c.heal){const amt=Math.round(b.hpMax*c.heal);b.hp=Math.min(b.hpMax,b.hp+amt);skillTxt=`✨${c.name} 回${amt}`;floatDmg('sideHero','+'+amt,'var(--green)');continue;}
      if(c.debuff){b.monDebuff=c.debuff;skillTxt=`🈲${c.name} 壓制`;continue;}
      if(c.taunt){b.tauntRounds=c.taunt;skillTxt=`📢${c.name} 挑釁！`;continue;}
      if(c.mult){atk*=c.mult;skillTxt=`${c.emoji}${c.name}爆發！`;break;}
    }
  }
  let dmg=Math.max(1,Math.round(atk-mon.def));
  b.monHp-=dmg;
  floatDmg('sideMon','-'+dmg,crit?'var(--gold)':'var(--red)');
  const el0=$('#battlelog');
  b.log.push(`${d.emoji} ${d.name} ${crit?'會心一擊':''}造成 ${dmg} ${skillTxt}`);
  if(b.monHp<=0){b.over=true;b.win=true;clearInterval(b.timer);b.log.push(`🏆 ${mon.name} 倒下了！`);render();return;}
  // 怪物行動
  let matk=mon.atk*ai.takeM*b.monDebuff*(0.85+Math.random()*0.3);
  if(b.tauntRounds>0){ matk*=1.15; b.tauntRounds--; } // 被挑釁：怒氣漲但只能打英雄
  b.monDebuff=1;
  let mdmg=Math.max(1,Math.round(matk-heroDef_(h)));
  b.hp-=mdmg; floatDmg('sideHero','-'+mdmg,'var(--red)');
  b.log.push(`${mon.emoji} ${mon.name} 反擊 ${mdmg}`);
  if(ai.thorns&&mdmg>0){ const t=Math.round(mdmg*ai.thorns); b.monHp-=t; b.log.push(`🛡️ 固守反傷 ${t}`); }
  if(b.hp<=0){b.over=true;b.win=false;clearInterval(b.timer);b.log.push(`☠️ ${d.name} 戰死沙場……`);render();return;}
  b.log=b.log.slice(-40);
  const el=$('#battlelog'); if(el)$('#main').innerHTML=renderBattleActive();
}
function flee(){
  const b=S.battle; if(!b)return; clearInterval(b.timer);
  const h=S.heroes.find(x=>x.uid===b.heroUid);
  h.fatigue=Math.min(100,h.fatigue+8); S.battle=null; save(); render(); toast('逃離戰場，疲勞 +8','var(--dim)');
}
function endBattle(){
  const b=S.battle; if(!b)return; clearInterval(b.timer);
  const h=S.heroes.find(x=>x.uid===b.heroUid), d=heroDef(h), mon=MONSTERS.find(m=>m.id===b.monId);
  const isMerc=!!h.merc;
  h.fatigue=Math.min(100,h.fatigue+12+mon.lv*3+Math.round(Math.random()*6));
  if(b.win){
    const ai=AI_MODES[S.aiMode];
    let g=Math.round(mon.gold*(0.9+Math.random()*0.2));
    if(isMerc){ g=Math.round(g*0.7); b.log.push(`（傭兵抽成新，報酬 ×0.7）`); }
    S.gold+=g; h.exp+=mon.exp;
    const drops=[];
    for(const [m,n] of Object.entries(mon.drops)){
      if(Math.random()<Math.min(.98,mon.drate*(ai.dropM||1))){ S.inv.mats[m]=(S.inv.mats[m]||0)+n; drops.push(MATERIALS[m].e+'×'+n); }
    }
    b.log.unshift(`🏆 擊殺 ${mon.name}！🪙${g}、EXP ${mon.exp}${drops.length?'，掉落 '+drops.join(' '):''}`);
    while(h.exp>=expNeed(h.lvl)){h.exp-=expNeed(h.lvl);h.lvl++;b.log.push(`⬆️ ${d.name} 升至 Lv.${h.lvl}！`);}
    S.exp+=Math.round(mon.exp/3);
    while(S.exp>=expNeed(S.lv)){S.exp-=expNeed(S.lv);S.lv++;b.log.push(`🌟 主君升至 Lv.${S.lv}！`);}
  } else {
    const keys=['str','vit','agi','wis','luk'].filter(k=>(h.perm[k]||0)>-3);
    const k=keys[Math.floor(Math.random()*keys.length)];
    h.perm[k]=(h.perm[k]||0)-1;
    b.log=[`☠️ ${d.name} 戰死。復活後「${STAT_CN[k]}」永久 -1……好好照料你的英雄。`];
  }
  if(isMerc){ // 傭兵用完即散
    S.heroes=S.heroes.filter(x=>x.uid!==h.uid); S.summoned=null;
    b.log.push('傭兵抱拳離去。（傭兵不進點將錄）');
  }
  S.battle=null; save(); render();
}

    <span class="emoji">${d.emoji}</span><div class="name">${d.name} Lv.${h.lvl}</div>

      <button class="act gold" ${h.fatigue>=80?'disabled title="疲勞紅燈"':''} onclick="startJob('${h.uid}')">派去打工</button>

function startJob(uid){
  const h=S.heroes.find(x=>x.uid===uid); if(!h||h.job)return;
  const sel=document.getElementById('jobsel_'+uid); h.job=sel.value; h.jobStart=Date.now();
  toast(`${heroDef(h).name} 出門${JOBS.find(j=>j.id===h.job).name}去了`); save(); render();
}
function stopJob(uid){
  const h=S.heroes.find(x=>x.uid===uid); if(!h||!h.job)return;
  const j=JOBS.find(x=>x.id===h.job), st=heroStats(h);
  const sec=Math.min((Date.now()-h.jobStart)/1000,8*3600);
  const eff=(st[JOB_BASE[j.id]]||8)/16*j.rate;
  const gain=Math.floor(sec/20*eff*(1+h.lvl*.08));
  if(gain>0) S.inv.mats[j.mat]=(S.inv.mats[j.mat]||0)+gain;
  h.fatigue=Math.min(100,h.fatigue+sec*0.002); h.job=null;
  toast(gain>0?`${heroDef(h).name} 帶回 ${j.matName}×${gain}`:`${heroDef(h).name} 回來了（收穫寥寥…）`);
  save(); render();
}

function train(uid,n=1){

function stallPrice(mat){ return Math.round(MATERIALS[mat].price*1.35); }

function openStall(uid){

function closeStall(){

function stallList(mat){
  const have=S.inv.mats[mat]||0; if(have<=0)return;

  if(ex)ex.count+=n; else S.stallStock.push({mat,count:n,price:stallPrice(mat)});
  save(); render();
}
function stallListCard(cid){
  if(!S.inv.cards[cid])return;
  S.inv.cards[cid]--;
  const ex=S.stallStock.find(x=>x.cardId===cid);
  if(ex)ex.count++; else S.stallStock.push({mat:null,cardId:cid,count:1,price:cardMarketPrice(cid)});

}

  if(S.inv.mats[mat]>0) stallList(mat);

function stallCustomer(){
  if(!S.stallHero||!S.stallStock.length)return;
  const h=S.heroes.find(x=>x.uid===S.stallHero); if(!h)return;

    <button class="act gold" ${S.gold>=PULL_COST*9?'':'disabled'} onclick="pull(9)">十連 🪙${PULL_COST*9}</button>
  </div></div>
  <div class="panel"><h2>🖼️ 圖鑑（${new Set(S.heroes.map(h=>h.defId)).size}/${HERO_DEFS.length}）</h2>

function pull(n){
  const cost=PULL_COST*n; if(S.gold<cost)return; S.gold-=cost;
  const got=[]; let hasRare=false;
  for(let i=0;i<n;i++){
    const avail={}; for(const k of ['SSR','SR','R','N']){ if(HERO_DEFS.some(d=>d.rarity===k))avail[k]={SSR:.05,SR:.2,R:.35,N:.4}[k]; }
    let rar=weightedPick(avail);
    if(i===n-1&&n===9&&!hasRare)rar=Math.random()<.5?'SR':'R';
    if(rar==='SR'||rar==='SSR')hasRare=true;
    const pool=HERO_DEFS.filter(d=>d.rarity===rar);
    const d=pool[Math.floor(Math.random()*pool.length)];
    S.heroes.push(makeHero(d.id)); got.push(d); S.pulls++;
  }
  save(); showPullModal(got); render();
}

  if(h.slots.filter(Boolean).length>=slotsOf(h)){toast('插槽已滿','var(--red)');return;}
  if(h.slots.filter(x=>x===cid).length>=2){toast('同名卡最多插 2 張','var(--red)');return;}
  const i=h.slots.indexOf(null); h.slots[i]=cid; S.inv.cards[cid]--;
  toast(`${heroDef(h).name} 裝備 ${CARD_DEFS[cid].emoji} ${CARD_DEFS[cid].name}`,'var(--green)'); save(); render();
}
function wipe(){ if(confirm('確定重置所有進度？')){ localStorage.removeItem(SAVE_KEY); location.reload(); } }

/* ---- 存檔碼導出/導入 ---- */
function b64enc(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64dec(b64){ return decodeURIComponent(escape(atob(b64))); }
function exportSave(){
  try{
    const payload = {v:2, t:Date.now(), state:S};
    const code = 'TWO1:' + b64enc(JSON.stringify(payload));
    const box = document.getElementById('savecode');
    box.innerHTML = `<textarea readonly style="width:100%;height:110px;background:#0e1420;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:11px;word-break:break-all">${code}</textarea>
    <div class="row"><button class="act green" onclick="copyCode(this)">📋 複製全部</button>
    <button class="act" onclick="document.getElementById('savecode').innerHTML=''">收起</button></div>`;
    navigator.clipboard && navigator.clipboard.writeText(code).then(()=>toast('存檔碼已複製到剪貼簿','var(--green)')).catch(()=>{});
  }catch(e){ toast('導出失敗：'+e.message,'var(--red)'); }
}
function copyCode(btn){
  const ta=document.querySelector('#savecode textarea'); if(!ta)return;
  ta.select(); try{document.execCommand('copy'); toast('已複製！','var(--green)');}catch(e){ toast('請手動全選複製','var(--dim)'); }
}
function importSaveUI(){
  const box = document.getElementById('savecode');
  box.innerHTML = `<textarea id="importcode" placeholder="貼上存檔碼（TWO1: 開頭）" style="width:100%;height:110px;background:#0e1420;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px"></textarea>
  <div class="row"><button class="act red" onclick="importSave()">📥 覆蓋導入</button>
  <button class="act" onclick="document.getElementById('savecode').innerHTML=''">取消</button></div>`;
}
function importSave(){
  const raw=(document.getElementById('importcode').value||'').trim();
  if(!raw.startsWith('TWO1:')){ toast('存檔碼格式錯誤（應以 TWO1: 開頭）','var(--red)'); return; }
  try{
    const payload = JSON.parse(b64dec(raw.slice(5)));
    if(!payload.state || !Array.isArray(payload.state.heroes)) throw new Error('結構不完整');
    if(!confirm(`確定覆蓋現有進度？\n存檔內容：英雄 ${payload.state.heroes.length} 位、🪙${payload.state.gold}、主君 Lv.${payload.state.lv}\n（存檔時間：${new Date(payload.t).toLocaleString('zh-TW')}）`)) return;
    S = payload.state;
    // 防呆：補齊舊版可能缺的欄位
    S.stallStock=S.stallStock||[]; S.stallLog=S.stallLog||[]; S.marketOffers=S.marketOffers||[];
    S.mercPool=S.mercPool||[]; S.marketDay=-1; S.mercDay=-1; S.battle=null; S.lastTick=Date.now();
    for(const h of S.heroes){ h.perm=h.perm||{str:0,vit:0,agi:0,wis:0,luk:0}; h.slots=h.slots||[null,null,null,null,null]; h.fatigue=h.fatigue||0; }
    save(); toast('✅ 存檔導入成功，進度已恢復！','var(--green)'); render();
  }catch(e){ toast('導入失敗：存檔碼損毀或無效','var(--red)'); }
}

/* ================= 啟動 ================= */
load(); offlineProgress(); render();
setInterval(()=>{
  const now=Date.now(); const dt=(now-(S.lastTick||now))/1000;
  for(const h of S.heroes){
    if(!h.job && S.summoned!==h.uid && S.stallHero!==h.uid) h.fatigue=Math.max(0,h.fatigue-dt*0.015);
  }
  stallCustomer();
  save();
  if(!S.battle) render();
},3000);
</script>
